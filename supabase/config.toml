project_id = "hfcfkxozzbrzzrejtbdj"

# Endpoint público chamado pela uazapi (webhook de recebimento): valida origem
# por um secret na query (?secret=UAZAPI_WEBHOOK_SECRET), não por JWT do Supabase.
[functions.webhook-zapi-receive]
verify_jwt = false

# Backend da tela de conexão do WhatsApp — chamado pelo frontend com a chave
# pública (modo interno/aberto). O token da instância fica só no servidor.
[functions.whatsapp-connection]
verify_jwt = false

# Backend da agenda de contatos do Google (People API). O callback do OAuth é um
# GET vindo do navegador (sem JWT), então precisa de verify_jwt = false. Tokens
# do Google ficam só no servidor (tabela google_integration).
[functions.google-contacts]
verify_jwt = false

# Endpoint público chamado pela Meta (WhatsApp Cloud API oficial): GET faz o
# handshake de verificação (hub.challenge), POST entrega eventos. A Meta não
# manda JWT do Supabase, validação é via hub.verify_token/META_WHATSAPP_VERIFY_TOKEN.
[functions.webhook-meta-whatsapp]
verify_jwt = false

# TEMPORÁRIO: ferramenta de teste manual (curl) pra disparar envio via WhatsApp
# Cloud API. Sem JWT de propósito pra teste rápido — endpoint fica público,
# rotacionar pra verify_jwt=true (ou trancar) antes de qualquer uso real.
[functions.whatsapp-send]
verify_jwt = false

# TEMPORÁRIO, uso único: registra o número no WhatsApp Cloud API (POST
# /register). Não aceita input no corpo (phone_number_id/token/pin só via env),
# então mesmo público não dá pra ninguém trocar o PIN chamando de fora.
# Considerar deletar depois que o registro for confirmado.
[functions.whatsapp-register]
verify_jwt = false

# Backfill do histórico de mensagens externas: exige JWT (verify_jwt padrão) E
# checa is_superadmin no corpo da função. Escreve em `mensagens`, então não é
# endpoint aberto — e o padrão do corpo é dry_run.
[functions.backfill-mensagens-externas]
verify_jwt = true

# TEMPORÁRIO, diagnóstico pontual: 4 GETs fixos na Graph API (nenhum input
# aceito, endpoints hardcoded) pra debugar o erro 133010 na migração de
# coexistência. Deletar depois de resolvido.
[functions.whatsapp-graph-check]
verify_jwt = false
# Assistente de escrita do composer (transcrição de áudio ditado + sugestão de
# mensagem otimizada via IA do Lovable). Chamado pelo frontend com o JWT do
# atendente — verify_jwt explícito pra ninguém deployar aberto pelo dashboard.
[functions.ai-texto]
verify_jwt = true

# Pede à uazapi o histórico ANTERIOR ao dia em que o sistema começou a gravar
# (/message/history-sync). Exige JWT de superadmin OU o secret de operador —
# abre janela para gravar mensagem com data/autoria arbitrárias.
[functions.historico-solicitar]
verify_jwt = true

# Importação inicial das conversas já existentes no WhatsApp: exige JWT e checa
# superadmin (ou service_role) no corpo. Escreve em clients/atendimentos/mensagens.
[functions.importar-conversas]
verify_jwt = true

# Renova fotos de perfil vencidas (clientes e grupos). Chamada pelo pg_cron com
# a chave pública, como os outros crons; só age em registros vencidos.
[functions.atualizar-fotos]
verify_jwt = true

# Endpoint público chamado pela uazapi com o evento `history` (retorno assíncrono
# dos pedidos acima). verify_jwt = false porque quem chama é a uazapi, não um
# usuário logado; a autenticação é o token da instância no corpo (fail-closed) +
# a exigência de um pedido aberto em historico_import_pedidos.
[functions.webhook-historico]
verify_jwt = false
